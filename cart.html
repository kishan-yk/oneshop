<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - OneShop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(black 15%, rgb(171, 0, 131));
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 50px;
      color: magenta;
      text-shadow: 0 0 15px magenta;
    }

    p {
      font-size: 22px;
      color: rgb(240, 200, 255);
      margin-top: 15px;
    }

    .back-btn {
      margin-top: 40px;
      background: linear-gradient(to right, purple, magenta);
      color: white;
      font-weight: bold;
      padding: 10px 25px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .back-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px magenta;
    }
  </style>
</head>
<body>
  <h1>🛠️ Page Under Maintenance</h1>
  <p>We’re working hard to bring you a better shopping experience.<br>
     Please check back soon!</p>

  <a href="index.html" class="back-btn">⬅ Back to Home</a>
</body>
</html>
